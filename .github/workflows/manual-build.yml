name: Build (manual toolchain)

on:
  workflow_dispatch:

jobs:
  toolchain:
    name: aapt2 → kotlinc → d8 → apksigner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Kotlin compiler
        run: |
          curl -sSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip -d "$HOME/kotlin"
          echo "KOTLIN_HOME=$HOME/kotlin/kotlinc" >> "$GITHUB_ENV"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./toolchain/build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: limbo-manual-apk
          path: dist/*.apk
          if-no-files-found: error
