name: Release

# Builds both ways and attaches the signed APKs to a GitHub release.
#
# Trigger it by pushing a tag (v1.0.1) or manually from the Actions tab. The version is taken from
# app/build.gradle.kts unless workflow_dispatch supplies one.
#
# Signing secrets (optional):
#   KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without them the build still succeeds and is signed with a throwaway preview key — useful for a
# first look, not for updating an already published app.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.1 (leave empty to read from build.gradle.kts)'
        required: false

permissions:
  contents: write

jobs:
  bundle:
    name: Gradle · signed APK + App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p toolchain/.keys
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > toolchain/.keys/limbo-release.jks
          echo "LIMBO_KEYSTORE=$GITHUB_WORKSPACE/toolchain/.keys/limbo-release.jks" >> "$GITHUB_ENV"
          echo "LIMBO_STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "LIMBO_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "LIMBO_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          gradle bundleRelease --no-daemon --stacktrace

      - name: Collect
        id: collect
        run: |
          VERSION="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
          [[ -n "${{ inputs.version }}" ]] && VERSION="${{ inputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist/release
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/release/Limbo-${VERSION}-universal.apk"
          done
          for f in app/build/outputs/bundle/release/*.aab; do
            cp "$f" "dist/release/Limbo-${VERSION}.aab"
          done
          ( cd dist/release && sha256sum *.apk *.aab > SHA256SUMS )
          ls -la dist/release

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: limbo-release
          path: dist/release/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          name: Limbo Keyboard ${{ steps.collect.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            dist/release/*.apk
            dist/release/*.aab
            dist/release/SHA256SUMS

  manual:
    name: Manual toolchain · aapt2 → kotlinc → d8
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Kotlin compiler
        run: |
          curl -sSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip -d "$HOME/kotlin"
          echo "KOTLIN_HOME=$HOME/kotlin/kotlinc" >> "$GITHUB_ENV"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./toolchain/build.sh --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: limbo-manual-release-apk
          path: dist/*.apk
          if-no-files-found: error
